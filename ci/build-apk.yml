name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug + release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/securenotes-release.jks" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias securenotes \
            -storepass securenotes123 \
            -keypass securenotes123 \
            -dname "CN=SecureNotes, OU=Mobile, O=SecureNotes, L=Internet, C=US"

          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=securenotes-release.jks
          storePassword=securenotes123
          keyAlias=securenotes
          keyPassword=securenotes123
          EOF

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Show outputs
        run: |
          find app/build/outputs/apk -name "*.apk" -print -exec ls -lh {} \;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureNotes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureNotes-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
