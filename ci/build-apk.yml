name: Build APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

# Required so the job can publish the APK as a Release asset.
permissions:
  contents: write

jobs:
  build:
    name: Assemble + publish signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/securenotes-release.jks" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias securenotes \
            -storepass securenotes123 \
            -keypass securenotes123 \
            -dname "CN=SecureNotes, OU=Mobile, O=SecureNotes, L=Internet, C=US"

          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=securenotes-release.jks
          storePassword=securenotes123
          keyAlias=securenotes
          keyPassword=securenotes123
          EOF

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename + verify APKs
        id: apks
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/SecureNotes-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk     dist/SecureNotes-debug.apk

          # Confirm the release APK really is signed.
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose dist/SecureNotes-release.apk

          ls -lh dist/
          echo "tag=v1.0.0-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts (fallback download)
        uses: actions/upload-artifact@v4
        with:
          name: SecureNotes-APKs
          path: dist/*.apk
          if-no-files-found: error

      # Publishes a Release so the APK gets a permanent, direct download URL
      # that anyone can open on their phone without signing in to GitHub.
      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apks.outputs.tag }}
          name: SecureNotes ${{ steps.apks.outputs.tag }}
          body: |
            📒 **SecureNotes** — privacy-first encrypted notes for Android.

            **Install:** download `SecureNotes-release.apk` below on your phone and open it.
            You may need to allow "Install unknown apps" for your browser.

            - Requires Android 8.0 (API 26) or newer
            - Signed with a generated release key
          files: dist/*.apk
          fail_on_unmatched_files: true
